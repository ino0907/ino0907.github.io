<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検3級 問題ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F2E5;
    --paper-line:#DCD2B4;
    --ink:#2A2A28;
    --navy:#22385A;
    --navy-soft:#3E5A82;
    --gold:#B8892B;
    --red:#B23A2E;
    --green:#2C6E4F;
    --card:#FFFFFF;
    --shadow: 0 2px 0 rgba(34,56,90,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(to bottom, transparent 0 38px, var(--paper-line) 38px 39px),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    line-height:1.75;
    padding:0 0 120px 0;
  }
  .wrap{max-width:760px;margin:0 auto;padding:36px 20px 0;}

  header.hero{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    border-bottom:3px solid var(--navy);
    padding-bottom:18px; margin-bottom:28px;
  }
  .hero-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:56px; height:56px; border-radius:50%;
    background:var(--navy); color:#fff; font-weight:900; font-size:22px;
    flex:none;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.15);
  }
  .hero-text h1{
    font-family:'Zen Old Mincho', serif;
    font-size:26px; margin:0 0 4px; letter-spacing:.02em; color:var(--navy);
  }
  .hero-text p{margin:0; font-size:13.5px; color:#5b5b54;}

  /* Settings panel */
  .panel{
    background:var(--card); border:1px solid var(--paper-line); border-radius:10px;
    padding:22px 22px 20px; margin-bottom:30px;
    box-shadow:var(--shadow);
  }
  .panel h2{font-size:15px; margin:0 0 14px; color:var(--navy); font-weight:700;}
  .section-toggle{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;
  }
  .chip{
    display:flex; align-items:center; gap:8px;
    border:1.5px solid var(--paper-line); border-radius:999px;
    padding:9px 16px; cursor:pointer; font-size:14px; user-select:none;
    transition:border-color .15s, background .15s;
    background:#FFFDF8;
  }
  .chip.active{ border-color:var(--navy); background:#EEF2F8; }
  .chip input{accent-color:var(--navy); width:16px; height:16px;}
  .count-row{display:flex; align-items:center; gap:10px; font-size:13.5px; color:#5b5b54; margin:2px 0 18px 4px;}
  .count-row select{
    font-family:inherit; font-size:14px; padding:5px 10px; border-radius:6px;
    border:1.5px solid var(--paper-line); background:#fff; color:var(--ink);
  }
  .make-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--navy); color:#fff; border:none; border-radius:8px;
    padding:13px 26px; font-family:inherit; font-size:15.5px; font-weight:700;
    cursor:pointer; letter-spacing:.02em;
  }
  .make-btn:disabled{opacity:.55; cursor:progress;}
  .make-btn:not(:disabled):hover{background:var(--navy-soft);}
  .hint{font-size:12.5px; color:#8a8578; margin-top:10px;}

  /* Section blocks */
  .section-title{
    display:flex; align-items:center; gap:10px;
    margin:34px 0 16px;
  }
  .section-title .num{
    width:34px; height:34px; border-radius:50%; background:var(--gold); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; flex:none;
  }
  .section-title h3{margin:0; font-size:16.5px; color:var(--navy);}
  .section-title p{margin:0; font-size:12.5px; color:#8a8578;}

  .passage-box{
    background:#FFFDF8; border:1px solid var(--paper-line); border-radius:8px;
    padding:18px 20px; margin-bottom:18px; font-size:14.5px;
  }
  .passage-box h4{margin:0 0 10px; font-family:'Zen Old Mincho', serif; color:var(--navy); font-size:16px;}

  .qcard{
    position:relative;
    background:var(--card);
    border:1px solid var(--paper-line); border-left:6px solid var(--navy);
    border-radius:8px; padding:20px 20px 20px 30px; margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .qcard.correct{border-left-color:var(--green);}
  .qcard.incorrect{border-left-color:var(--red);}
  .qnum{
    position:absolute; left:-19px; top:16px;
    width:38px; height:38px; border-radius:50%; background:var(--navy);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:15px;
  }
  .qcard.correct .qnum{background:var(--green);}
  .qcard.incorrect .qnum{background:var(--red);}

  .dialogue-line{margin:0 0 6px; font-size:15px;}
  .dialogue-line b{color:var(--navy-soft);}
  .options{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .option{
    display:flex; align-items:center; gap:12px;
    border:1.5px solid var(--paper-line); border-radius:8px;
    padding:9px 14px; cursor:pointer; font-size:14.5px;
    background:#FFFEFC;
    transition:border-color .12s, background .12s;
  }
  .option:hover{border-color:var(--navy-soft);}
  .option.picked{border-color:var(--navy); background:#EEF2F8;}
  .option .obadge{
    width:24px; height:24px; border-radius:50%; border:1.5px solid #9a927a;
    display:flex; align-items:center; justify-content:center; font-size:12px; flex:none;
    color:#6a6555;
  }
  .option.picked .obadge{background:var(--navy); border-color:var(--navy); color:#fff;}
  .option.correct-answer{border-color:var(--green); background:#EAF6EF;}
  .option.correct-answer .obadge{background:var(--green); border-color:var(--green); color:#fff;}
  .option.wrong-pick{border-color:var(--red); background:#FBEAE8;}
  .option.wrong-pick .obadge{background:var(--red); border-color:var(--red); color:#fff;}
  .option.locked{cursor:default;}

  .explain{
    margin-top:12px; font-size:13px; color:#4a4638;
    background:#FBF6E9; border:1px dashed var(--gold); border-radius:6px; padding:10px 12px;
    display:none;
  }
  .explain.show{display:block;}
  .explain .verdict{font-weight:700; margin-bottom:6px; color:var(--navy);}
  .explain .why{color:#4a4638;}

  .skeleton{
    background:var(--card); border:1px solid var(--paper-line); border-radius:8px;
    padding:24px; text-align:center; color:#8a8578; font-size:14px; margin-bottom:16px;
  }
  .skeleton .dots::after{content:'…'; animation:blink 1.2s infinite steps(1);}
  @keyframes blink{0%,100%{opacity:.3;}50%{opacity:1;}}

  .error-box{
    background:#FBEAE8; border:1px solid var(--red); color:var(--red);
    border-radius:8px; padding:14px 16px; font-size:13.5px; margin-bottom:16px;
  }
  .retry-btn{
    margin-top:10px; font-family:inherit; font-weight:700; font-size:13.5px;
    background:var(--red); color:#fff; border:none; border-radius:6px;
    padding:8px 16px; cursor:pointer;
  }

  /* Sticky footer */
  .footer-bar{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--card); border-top:2px solid var(--navy);
    padding:14px 20px; display:flex; align-items:center; justify-content:center; gap:18px;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
  }
  .footer-bar span{font-size:13.5px; color:#5b5b54;}
  .footer-bar .score{font-weight:700; color:var(--navy); font-size:15px;}
  .footer-bar button{
    font-family:inherit; font-weight:700; font-size:14.5px; border:none; border-radius:8px;
    padding:11px 22px; cursor:pointer;
  }
  .grade-btn{background:var(--gold); color:#fff;}
  .grade-btn:disabled{opacity:.4; cursor:not-allowed;}
  .redo-btn{background:var(--navy); color:#fff;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="hero-badge">英検</div>
      <div class="hero-text">
        <h1>英検3級 実戦問題メーカー</h1>
        <p>過去問と同じレベル・形式の新しい問題をその場で作成して、何度でも練習できます。</p>
      </div>
    </div>
  </header>

  <div class="panel" id="settingsPanel">
    <h2>出題する形式を選んでください</h2>
    <div class="section-toggle">
      <label class="chip active" id="chipVocab">
        <input type="checkbox" checked data-key="vocab"> 大問1：単語・熟語・文法
      </label>
      <label class="chip active" id="chipDialogue">
        <input type="checkbox" checked data-key="dialogue"> 大問2：会話文の応答
      </label>
      <label class="chip" id="chipReading">
        <input type="checkbox" data-key="reading"> 大問3：長文読解
      </label>
    </div>
    <div class="count-row">
      大問1の問題数：
      <select id="vocabCount">
        <option value="5">5問</option>
        <option value="10" selected>10問</option>
        <option value="15">15問</option>
      </select>
      <span style="color:#c9c2ac;">|</span>
      大問2は5問・大問3は1つの英文＋5問で固定です
    </div>
    <button class="make-btn" id="makeBtn">問題を作成する</button>
    <div class="hint">※ AIがその都度新しい問題文を作成します。内容は毎回変わります。</div>
  </div>

  <div id="quizArea"></div>

</div>

<div class="footer-bar hidden" id="footerBar">
  <span id="progressText">0問 採点済み</span>
  <span class="score hidden" id="scoreText"></span>
  <button class="redo-btn hidden" id="redoBtn">新しい問題を作成</button>
</div>

<script>
const state = {
  vocab: [], dialogue: [], reading: null,
  answers: {}, gradedQ: {}
};

const el = id => document.getElementById(id);

// chip toggle styling
document.querySelectorAll('.chip').forEach(chip=>{
  const cb = chip.querySelector('input');
  cb.addEventListener('change', ()=> chip.classList.toggle('active', cb.checked));
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function callClaude(systemPrompt, userPrompt, maxTokens){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: maxTokens || 2000,
      system: systemPrompt,
      messages: [{role:"user", content: userPrompt}]
    })
  });
  if(!response.ok){
    throw new Error(`APIエラー (status ${response.status})`);
  }
  const data = await response.json();
  if(data.error){
    throw new Error(data.error.message || 'APIエラー');
  }
  const text = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  if(!text.trim()){
    throw new Error('応答が空でした');
  }
  // Extract the outermost JSON object even if stray text/code fences surround it,
  // and even if the response was cut off before the closing brace.
  let cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  const firstBrace = cleaned.indexOf('{');
  if(firstBrace === -1){
    throw new Error('JSON形式の応答が見つかりませんでした');
  }
  cleaned = cleaned.slice(firstBrace);
  try{
    return JSON.parse(cleaned);
  }catch(e){
    // Response was likely truncated mid-JSON. Try trimming back to the last
    // complete object/array boundary and closing any open brackets.
    const repaired = attemptJsonRepair(cleaned);
    if(repaired) return repaired;
    throw new Error('応答が途中で切れたか、JSON形式が崩れていました');
  }
}

function attemptJsonRepair(str){
  // Try progressively shorter substrings ending at a safe point ("}," or "}"),
  // closing any unbalanced brackets, until one parses successfully.
  const closers = { '{':'}', '[':']' };
  for(let cut = str.length; cut > 20; cut--){
    if(str[cut-1] !== '}' && str[cut-1] !== ']') continue;
    const candidate = str.slice(0, cut);
    const stack = [];
    let inString = false, escape = false, ok = true;
    for(const ch of candidate){
      if(escape){ escape = false; continue; }
      if(ch === '\\'){ escape = true; continue; }
      if(ch === '"'){ inString = !inString; continue; }
      if(inString) continue;
      if(ch === '{' || ch === '[') stack.push(ch);
      else if(ch === '}' || ch === ']'){
        const open = stack.pop();
        if(!open || closers[open] !== ch){ ok = false; break; }
      }
    }
    if(!ok || inString) continue;
    let attempt = candidate;
    while(stack.length){ attempt += closers[stack.pop()]; }
    try{ return JSON.parse(attempt); }catch(e){ /* keep trying shorter cuts */ }
  }
  return null;
}

const VOCAB_SYS = `あなたは実用英語技能検定（英検）3級の問題作成者です。過去の公開問題と同じ語彙レベル・文法範囲・話題（学校生活、家族、旅行、趣味、街のイベント、アルバイトなど）で、大問1形式（短い対話または1文の空所補充）の問題を作成します。

【出題する文法・語彙の方針（実際の出題頻度に基づく）】
生成する問題全体の中で、以下の割合を目安にバランスよく配分すること。
- 約半分は文法問題。中でも次の「最重要文法」を優先的に出題する：
  1. 時制（現在形／過去形／未来形。will と be going to の使い分けを含む）
  2. 助動詞（can, will, must, should, may など。助動詞の後ろは必ず動詞の原形にする）
  3. 不定詞（to+動詞の原形。名詞的用法・形容詞的用法・副詞的用法）
  4. 動名詞（動詞+ing。特に like/enjoy/finish/stop など動名詞を目的語にとる動詞との組み合わせ）
  5. 比較（原級 as〜as／比較級 -er・more〜than／最上級 the -est・the most〜）
  また、次の「頻出文法」も適度に含める：接続詞(because/when/if)、受け身(be+過去分詞)、前置詞(at/to/from/forなど)、疑問文・否定文の形(do/does/be動詞/don't/doesn't/isn't/aren't)、代名詞(some/any/everyone/someoneなど)。
- 前置詞とセットになる熟語（take off, get off, look forward to など）を1〜2問程度含める。
- 残りは日常生活で使う名詞・動詞・形容詞などの語彙問題にする。
- 生徒が間違えやすい「三人称単数のs」「時制の一致（文章全体の時制と動詞の形が揃っているか）」「SVOO語順（tell+人+事、give+人+物など）」も、自然な形で1〜2問程度含めてよい。

【問題としての質の基準】
- 正解は必ず1つだけに定まるようにし、複数の選択肢が正解になり得る曖昧な問題は作らないこと。
- 誤答の選択肢は、品詞や時制が明らかに不自然、または意味が文脈に合わないものにし、紛らわしすぎない範囲で作ること。
- 中学卒業程度（英検3級=CEFR A1相当）の語彙・構文の範囲を超えないこと。

出力は厳密なJSONのみ。説明文やマークダウンのコードフェンスは一切付けないこと。
スキーマ:
{"questions":[{"lines":[{"speaker":"A"|"B"|null,"text":"英文。空所は(     )で示す"}],"options":["語1","語2","語3","語4"],"answer":0,"explanation":"なぜその答えが正しいかの日本語での短い説明(1文)。文法問題の場合はどの文法事項か（例:助動詞の後は原形、動名詞をとる動詞など）にも触れる"}]}
- lines配列は1〜2要素（対話ならspeakerに"A"/"B"、1文の文ならspeakerはnull）。
- optionsは英単語または短い語句4つ、正解は1つだけ。answerはoptions配列内の正解のindex(0始まり)。`;

const DIALOGUE_SYS = `あなたは実用英語技能検定（英検）3級の問題作成者です。過去の公開問題と同じレベルで、大問2形式（3行程度の会話のうち1行が空所になっており、文脈に合う応答を選ぶ）の問題を作成します。

【文法・表現の方針】
会話の中で、次のような英検3級の頻出文法・表現を自然に使うこと（無理に詰め込む必要はないが、自然に登場する範囲で活用する）：
- 時制（現在・過去・未来／will と be going to）、助動詞（can/will/must/should）、疑問文・否定文の形、接続詞(because/when/if)、比較表現、Would you like 〜? / Can you 〜? / Why don't we 〜? のような依頼・勧誘表現。
空所になる行は、直前・直後の発言だけで論理的に一つに絞れる自然な応答にすること（複数の選択肢が当てはまってしまう曖昧な文脈は避ける）。

出力は厳密なJSONのみ。説明文やマークダウンのコードフェンスは一切付けないこと。
スキーマ:
{"questions":[{"lines":[{"speaker":"A","text":"..."},{"speaker":"B","text":"..."},{"speaker":"A","text":"..."}],"blankIndex":1,"options":["応答文1","応答文2","応答文3","応答文4"],"answer":0,"explanation":"日本語での短い説明(1文)。会話の流れのどの部分から正解が判断できるかに触れる"}]}
- linesは2〜3行の会話。blankIndexはlines配列の中で空所になっている行のインデックス（そのtextは"(     )"のままにする）。
- optionsは4つの完全な英文（応答）、正解は1つだけ。
- 日常生活の自然な会話（家族、友人、学校、買い物、旅行など）にすること。`;

const READING_SYS = `あなたは実用英語技能検定（英検）3級の問題作成者です。過去の公開問題（大問3C）と同じレベルで、150〜200語程度の易しい英語の読み物（実在の人物・行事・文化・自然などのノンフィクション調）を1つ作成し、その内容に関する4択の内容一致問題を5問作成します。
出力は厳密なJSONのみ。説明文やマークダウンのコードフェンスは一切付けないこと。
スキーマ:
{"title":"英文タイトル","passage":"英文本文(150-200語)","questions":[{"question":"質問文(英語)","options":["...","...","...","...  "],"answer":0,"explanation":"日本語での短い説明(1文)"}]}
- questionsは5問。最後の1問は文章全体のテーマを問う設問にすること。`;

function optionRow(qid, idx, text){
  return `<div class="option" data-qid="${qid}" data-idx="${idx}" onclick="pickOption(this)">
    <span class="obadge">${idx+1}</span><span>${escapeHtml(text)}</span>
  </div>`;
}

function buildVocabHTML(){
  let html = `<div class="section-title"><div class="num">1</div><div><h3>単語・熟語・文法</h3><p>(　　　)に入れるのに最も適切なものを選びなさい</p></div></div>`;
  state.vocab.forEach((q, i)=>{
    const qid = 'v'+i;
    const lineHtml = q.lines.map(l => `<p class="dialogue-line">${l.speaker?('<b>'+l.speaker+':</b> '):''}${escapeHtml(l.text)}</p>`).join('');
    html += `<div class="qcard" id="card_${qid}">
      <div class="qnum">${i+1}</div>
      ${lineHtml}
      <div class="options">${q.options.map((o,idx)=>optionRow(qid,idx,o)).join('')}</div>
      <div class="explain" id="exp_${qid}"></div>
    </div>`;
  });
  return html;
}

function buildDialogueHTML(){
  let html = `<div class="section-title"><div class="num">2</div><div><h3>会話文の応答</h3><p>(　　　)に入れるのに最も適切なものを選びなさい</p></div></div>`;
  state.dialogue.forEach((q, i)=>{
    const qid = 'd'+i;
    const lineHtml = q.lines.map((l,li) => {
      const t = li===q.blankIndex ? '(　　　)' : escapeHtml(l.text);
      return `<p class="dialogue-line"><b>${l.speaker}:</b> ${t}</p>`;
    }).join('');
    html += `<div class="qcard" id="card_${qid}">
      <div class="qnum">${i+1}</div>
      ${lineHtml}
      <div class="options">${q.options.map((o,idx)=>optionRow(qid,idx,o)).join('')}</div>
      <div class="explain" id="exp_${qid}"></div>
    </div>`;
  });
  return html;
}

function buildReadingHTML(){
  const r = state.reading;
  let html = `<div class="section-title"><div class="num">3</div><div><h3>長文読解</h3><p>本文を読んで質問に対する答えを選びなさい</p></div></div>`;
  html += `<div class="passage-box"><h4>${escapeHtml(r.title)}</h4><p>${escapeHtml(r.passage)}</p></div>`;
  r.questions.forEach((q,i)=>{
    const qid = 'r'+i;
    html += `<div class="qcard" id="card_${qid}">
      <div class="qnum">${i+1}</div>
      <p class="dialogue-line">${escapeHtml(q.question)}</p>
      <div class="options">${q.options.map((o,idx)=>optionRow(qid,idx,o)).join('')}</div>
      <div class="explain" id="exp_${qid}"></div>
    </div>`;
  });
  return html;
}

function pickOption(node){
  const qid = node.dataset.qid;
  if(state.gradedQ[qid]) return; // already graded, lock further changes
  const idx = parseInt(node.dataset.idx,10);
  state.answers[qid] = idx;
  gradeOne(qid);
}

function optionTextFor(qid, idx){
  if(idx===undefined || idx===null) return '';
  if(qid.startsWith('v')) return state.vocab[parseInt(qid.slice(1))].options[idx];
  if(qid.startsWith('d')) return state.dialogue[parseInt(qid.slice(1))].options[idx];
  if(qid.startsWith('r')) return state.reading.questions[parseInt(qid.slice(1))].options[idx];
}

function gradeOne(qid){
  const correctIdx = correctFor(qid);
  const picked = state.answers[qid];
  const card = el('card_'+qid);
  const opts = document.querySelectorAll(`.option[data-qid="${qid}"]`);
  opts.forEach(o=>{
    o.classList.add('locked');
    o.onclick = null;
    const idx = parseInt(o.dataset.idx,10);
    if(idx===correctIdx) o.classList.add('correct-answer');
    if(picked===idx && idx!==correctIdx) o.classList.add('wrong-pick');
  });
  const isCorrect = picked===correctIdx;
  state.gradedQ[qid] = true;
  if(card) card.classList.add(isCorrect ? 'correct':'incorrect');

  const exp = el('exp_'+qid);
  if(exp){
    const correctText = optionTextFor(qid, correctIdx);
    const pickedText = optionTextFor(qid, picked);
    let verdictLine = isCorrect
      ? `正解です！ ${picked+1}「${pickedText}」で合っています。`
      : `不正解です。あなたの解答は ${picked+1}「${pickedText}」でしたが、正解は ${correctIdx+1}「${correctText}」です。`;
    exp.innerHTML = `<div class="verdict">${escapeHtml(verdictLine)}</div><div class="why">理由: ${escapeHtml(explanationFor(qid))}</div>`;
    exp.classList.add('show');
  }
  updateProgress();
}

function totalQuestionCount(){
  return state.vocab.length + state.dialogue.length + (state.reading? state.reading.questions.length : 0);
}

function updateProgress(){
  const total = totalQuestionCount();
  const answeredQids = Object.keys(state.gradedQ);
  const answered = answeredQids.length;
  let correctCount = 0;
  answeredQids.forEach(qid=>{ if(state.answers[qid]===correctFor(qid)) correctCount++; });
  el('progressText').textContent = `${answered} / ${total} 問 採点済み`;
  if(answered>0){
    el('scoreText').textContent = `正解数: ${correctCount} / ${answered}`;
    el('scoreText').classList.remove('hidden');
  } else {
    el('scoreText').classList.add('hidden');
  }
  if(total>0 && answered===total){
    el('redoBtn').classList.remove('hidden');
  }
}

function correctFor(qid){
  if(qid.startsWith('v')) return state.vocab[parseInt(qid.slice(1))].answer;
  if(qid.startsWith('d')) return state.dialogue[parseInt(qid.slice(1))].answer;
  if(qid.startsWith('r')) return state.reading.questions[parseInt(qid.slice(1))].answer;
}
function explanationFor(qid){
  if(qid.startsWith('v')) return state.vocab[parseInt(qid.slice(1))].explanation;
  if(qid.startsWith('d')) return state.dialogue[parseInt(qid.slice(1))].explanation;
  if(qid.startsWith('r')) return state.reading.questions[parseInt(qid.slice(1))].explanation;
}

el('redoBtn').addEventListener('click', ()=>{
  el('quizArea').innerHTML='';
  el('footerBar').classList.add('hidden');
  el('settingsPanel').classList.remove('hidden');
  state.vocab=[]; state.dialogue=[]; state.reading=null; state.answers={}; state.gradedQ={};
  el('scoreText').classList.add('hidden');
  el('redoBtn').classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});

function getVocabN(){ return parseInt(el('vocabCount').value,10) || 10; }

const SECTION_CONFIG = {
  vocab: {
    label:'大問1',
    sys: () => VOCAB_SYS,
    prompt: () => `英検3級の大問1形式の問題を${getVocabN()}問、日本語の指示に従いJSONのみで作成してください。`,
    tokens: () => 420 + getVocabN()*180,
    validate: data => data && Array.isArray(data.questions) && data.questions.length>0,
    apply: data => { state.vocab = data.questions; },
    build: buildVocabHTML
  },
  dialogue: {
    label:'大問2',
    sys: () => DIALOGUE_SYS,
    prompt: () => `英検3級の大問2形式の問題を5問、日本語の指示に従いJSONのみで作成してください。`,
    tokens: () => 1600,
    validate: data => data && Array.isArray(data.questions) && data.questions.length>0,
    apply: data => { state.dialogue = data.questions; },
    build: buildDialogueHTML
  },
  reading: {
    label:'大問3',
    sys: () => READING_SYS,
    prompt: () => `英検3級の大問3C形式の長文と問題5問を、日本語の指示に従いJSONのみで作成してください。`,
    tokens: () => 2200,
    validate: data => data && typeof data.passage === 'string' && Array.isArray(data.questions) && data.questions.length>0,
    apply: data => { state.reading = data; },
    build: buildReadingHTML
  }
};

async function generateSection(type){
  const cfg = SECTION_CONFIG[type];
  const container = el('sec_'+type);
  if(!container) return;
  container.innerHTML = `<div class="skeleton">${cfg.label}の問題を作成中<span class="dots"></span></div>`;
  try{
    const data = await callClaude(cfg.sys(), cfg.prompt(), cfg.tokens());
    if(!cfg.validate(data)) throw new Error('想定した形式のデータが返されませんでした');
    cfg.apply(data);
    container.innerHTML = cfg.build();
  }catch(err){
    container.innerHTML = `<div class="error-box">${escapeHtml(cfg.label)}の作成に失敗しました：${escapeHtml(err.message||String(err))}<br><button class="retry-btn" onclick="retrySection('${type}')">もう一度作成する</button></div>`;
  }
  updateProgress();
}

function retrySection(type){ generateSection(type); }

async function makeQuiz(){
  const wantVocab = el('chipVocab').querySelector('input').checked;
  const wantDialogue = el('chipDialogue').querySelector('input').checked;
  const wantReading = el('chipReading').querySelector('input').checked;

  if(!wantVocab && !wantDialogue && !wantReading){
    alert('少なくとも1つの形式を選んでください。');
    return;
  }

  el('makeBtn').disabled = true;
  el('makeBtn').textContent = '作成中…';
  el('settingsPanel').classList.add('hidden');

  let html = '';
  if(wantVocab) html += `<div id="sec_vocab"></div>`;
  if(wantDialogue) html += `<div id="sec_dialogue"></div>`;
  if(wantReading) html += `<div id="sec_reading"></div>`;
  el('quizArea').innerHTML = html;

  el('footerBar').classList.remove('hidden');
  el('progressText').textContent = '0問 採点済み';
  el('scoreText').classList.add('hidden');
  el('redoBtn').classList.add('hidden');

  const tasks = [];
  if(wantVocab) tasks.push(generateSection('vocab'));
  if(wantDialogue) tasks.push(generateSection('dialogue'));
  if(wantReading) tasks.push(generateSection('reading'));

  await Promise.allSettled(tasks);
  el('makeBtn').disabled = false;
  el('makeBtn').textContent = '問題を作成する';
}

el('makeBtn').addEventListener('click', makeQuiz);
</script>
